extension:
  name: ossie
  description: The Apache Ossie (incubating) extension for DuckDB. Reads Ossie
    semantic model files in YAML or JSON and answers semantic queries against the tables in DuckDB,
    from a single binary, with no infrastructure. Also exposes the semantic layer via MCP.
  version: 0.3.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
    - PradyunT
    - venkata-chikkam
    - iqea-ai

repo:
  github: iqea-ai/duckdb-ossie
  variegata: 48523ab83287f1b62fb7eac05840b200b782c320
  ref: ba25e73b517be90ba1eb9a64ef4803c8266f373c

docs:
  hello_world: |
    INSTALL ossie FROM community;
    LOAD ossie;

    -- A model is a file you supply. This one is written inline so the example runs as pasted;
    -- normally you would point ossie_load at a .yaml or .json file from your own repository.
    CREATE TABLE orders(order_id INTEGER, customer_id INTEGER, amount DECIMAL(10,2));
    CREATE TABLE customers(customer_id INTEGER, country VARCHAR);
    INSERT INTO orders VALUES (1,1,100.00),(2,1,250.00),(3,2,75.00);
    INSERT INTO customers VALUES (1,'US'),(2,'DE');

    COPY (SELECT '{
      "version": "0.3.0.dev0",
      "name": "sales",
      "datasets": [
        {"name": "orders", "source": "memory.main.orders", "fields": [
          {"name": "customer_id", "expression": {"dialects": [{"dialect": "ANSI_SQL", "expression": "customer_id"}]}},
          {"name": "amount",      "expression": {"dialects": [{"dialect": "ANSI_SQL", "expression": "amount"}]}}]},
        {"name": "customers", "source": "memory.main.customers", "primary_key": ["customer_id"], "fields": [
          {"name": "customer_id", "expression": {"dialects": [{"dialect": "ANSI_SQL", "expression": "customer_id"}]}},
          {"name": "country",     "expression": {"dialects": [{"dialect": "ANSI_SQL", "expression": "country"}]}}]}],
      "relationships": [{"name": "orders_to_customers", "from": "orders", "to": "customers",
                         "from_columns": ["customer_id"], "to_columns": ["customer_id"]}],
      "metrics": [{"name": "revenue", "expression": {"dialects": [
                   {"dialect": "ANSI_SQL", "expression": "SUM(orders.amount)"}]}}]}'
    ) TO 'sales_model.json' (FORMAT csv, HEADER false, QUOTE '');

    CALL ossie_load('sales_model.json');

    -- Discover the vocabulary. An agent reads these before asking anything.
    SELECT name, expression FROM ossie_metrics();
    SELECT dataset, name FROM ossie_fields();

    -- Ask a question: metrics, dimensions, filters.
    SELECT * FROM ossie_query(['revenue'], ['customers.country']);

    -- Or get the SQL without running it, for use where DuckDB is not the executor.
    SELECT ossie_compile(['revenue'], ['customers.country'], []);

  extended_description: |
    Apache Ossie is a vendor-neutral file format for semantic models: datasets bound to physical
    tables, fields, declared relationships, and metrics written as aggregate expressions. It
    describes data in place and never transforms it. What the format deliberately leaves open is
    the *query* those definitions go into -- the joins, the GROUP BY, and the grain -- because
    those depend on the question being asked, and the file does not know the question.

    **The converters in apache/ossie translate** definitions into some vendor's semantic layer so
    that vendor's engine can run them. This one executes the query itself, and it needs no
    infrastructure: a model file, your tables, and a single binary.

    **Functions**

    - `ossie_load(path, ...)` -- parse and validate a model, YAML or JSON. Named arguments:
      `rebind` remaps warehouse-qualified source prefixes onto the local catalog,
      `validate_sources` requires every dataset's table to exist, `allow_filter_functions`
      sets the filter policy at load so a caller supplying filters cannot widen its own policy,
      and `left_joins` keeps fact rows whose foreign key matches no dimension row
    - `ossie_query(metrics, dimensions, filters)` -- compile the request and execute it. `filters`
      are conditions on rows; the named argument `metric_filters` takes conditions on metrics,
      applied after aggregation. `ossie_query(query)` takes the same request as one JSON object,
      which can also name its output columns
    - `ossie_compile(metrics, dimensions, filters)` -- the same SQL as text, without running it
    - `ossie_sql(query)` -- run one `SELECT` written over the model's relations: a dataset is
      `model.dataset`, its fields are its columns, and `AGG(measure)` evaluates a dataset-scoped
      metric, over a join as well, where it counts each row of its own dataset once
    - `ossie_datasets()`, `ossie_fields()`, `ossie_metrics()`, `ossie_relationships()` -- the
      model's vocabulary, including `ai_context` synonyms and cardinality derived from declared keys

    **Refusals are a feature**

    The primary consumer is an AI agent, which cannot check the number it receives, so a plausible
    wrong answer is worse than an error. Where the model or the request underdetermines the query,
    the extension refuses and names the offending object: an aggregate that does not say which
    dataset's rows it runs over, joins that would fan out and inflate every aggregate, and requests
    where two different join paths could produce two different numbers. A refusal the Ossie Wide
    Table specification defines starts with its error code, such as `E_NO_PATH` or
    `E_AMBIGUOUS_PATH`. Error text is part of the interface -- an agent reads it and retries -- so
    refusals are tested on their message, not merely on the fact that they threw.

    **Conformance**

    Models are validated against the format's own `core-spec/ossie-schema.json`. The test suite
    includes fifteen models vendored verbatim from apache/ossie: the spec's own examples (TPC-DS,
    flights, renamed fields) and its compliance models (wide-table retail and stores, the scott
    query model, the portability ladder m0-m3). Twelve load and answer queries; the three refusals
    are the portability models that name a column without its dataset, which the spec forbids.
    Generated SQL is diffed against hand-written TPC-DS equivalents with symmetric EXCEPT over
    dsdgen(sf = 0.01) data, so correctness is measured against the numbers rather than against our
    own output. That covers total_sales, store_productivity and customer_lifetime_value against
    hand-written SQL, and total_sales, total_profit and a computed customer field against the same
    model written in OSSIE_SQL_2026. The remaining metrics are exercised by golden-SQL, grain or
    vocabulary tests, none of which can catch a wrong number. The 46 wide-table compliance cases of
    apache/ossie are run against the extension as well, and all 46 pass with the model loaded with
    `left_joins => true`, the join the specification requires.

    Models use the document shape of Ossie 0.3.0.dev0, with expressions in OSSIE_SQL_2026 (the
    spec's own expression language, written as expression.sql) or ANSI_SQL. Dataset-scoped metrics
    are addressed as dataset.metric and combined in a model-scoped metric with AGG(dataset.metric).
    Metrics that aggregate at more than one grain are
    computed per grain and joined on the dimension values; joins are INNER unless the model is loaded
    with `left_joins => true`. Current limits are documented rather than hidden: table-backed sources
    only, and window-function metrics refused rather than answered wrongly. See docs/limitations.md.

    **Serving a model to an AI agent**

    `examples/server.sql` publishes a model over MCP via the duckdb_mcp community extension, giving
    an agent a `semantic_query` tool plus `metrics` and `dimensions` resources to discover names
    from. Within that tool the agent reaches nothing but the model's own vocabulary: filters are
    allowlisted, subqueries are refused outright, and no argument lets a caller widen that.

    That holds for the connection, not just the tool: server.sql disables every built-in duckdb_mcp
    tool -- query, export, list_tables, describe, database_info -- so tools/list returns only
    semantic_query and calling anything else is refused. Disabling query alone would not be enough,
    because export takes an arbitrary SQL argument and reaches the same data. A CI job asserts both
    directions of this on every push.

    This is an independent implementation of the Apache Ossie file format. It is not affiliated
    with, endorsed by, or an official product of the Apache Software Foundation.
