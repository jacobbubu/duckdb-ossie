version: "0.3.0.dev0"
name: dataset_metric_duplicate
datasets:
  - name: orders
    source: memory.main.orders
    fields:
      - name: amount
        expression:
          sql: amount
    metrics:
      - name: revenue
        expression:
          sql: SUM(amount)
      - name: revenue
        expression:
          sql: SUM(amount) * 2
