version: "0.3.0.dev0"
name: dataset_metrics
description: Dataset-scoped metrics, source columns and AGG(dataset.metric)
datasets:
  - name: orders
    source: memory.main.orders
    primary_key: [order_id]
    fields:
      - name: order_id
        datatype: Integer
        expression:
          sql: order_id
      - name: customer_id
        datatype: Integer
        expression:
          sql: cust_id
      - name: amount
        datatype: Decimal
        expression:
          sql: amount_cents / 100.0
    metrics:
      - name: revenue
        datatype: Decimal
        expression:
          sql: SUM(amount)
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: SUM(amount) + 0
            - dialect: SNOWFLAKE
              expression: SUM(amount_cents) / 100
      - name: order_count
        datatype: Integer
        expression:
          sql: COUNT(*)
      - name: shipped_count
        datatype: Integer
        expression:
          sql: COUNT(source.shipped_at)
  - name: customers
    source: memory.main.customers
    primary_key: [customer_id]
    fields:
      - name: customer_id
        datatype: Integer
        expression:
          sql: customer_id
      - name: region
        datatype: String
        expression:
          sql: region
    metrics:
      - name: customer_count
        datatype: Integer
        expression:
          sql: COUNT(DISTINCT customer_id)
relationships:
  - name: orders_to_customers
    from: orders
    to: customers
    from_columns: [customer_id]
    to_columns: [customer_id]
metrics:
  - name: revenue_per_customer
    datatype: Decimal
    expression:
      sql: AGG(orders.revenue) / AGG(customers.customer_count)
